# Perfil de producción. Se activa con la variable SPRING_PROFILES_ACTIVE=prod
# Sin valores por defecto: si falta una variable, la app no arranca (fail-fast).

# --- Base de datos y URL pública: obligatorias ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
sillon.url-publica=${URL_PUBLICA}

# --- Detrás del proxy (Render, un balanceador de AWS...) ---
# Respeta X-Forwarded-Proto/For: la app sabe que la petición llegó por HTTPS.
# Lo necesitaremos para la cookie Secure del refresh token (B3) y la IP real (B4).
#server.forward-headers-strategy=framework

# native: Tomcat resuelve la IP real recorriendo X-Forwarded-For de derecha a izquierda,
# saltando solo proxies de red privada. Con "framework" el cliente podía falsificarla.
server.forward-headers-strategy=native

# --- Swagger apagado: no se publica el mapa de la API ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Errores: nunca detalles internos hacia afuera ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- CORS: obligatorio en producción ---
sillon.cors.origenes-permitidos=${CORS_ORIGENES}
# --- Sesión: la cookie del refresh token solo viaja por HTTPS ---
sillon.sesion.cookie-segura=true