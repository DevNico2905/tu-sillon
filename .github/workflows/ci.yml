name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si haces push otra vez al mismo PR, cancela la corrida anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el workflow solo lee el repo
permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sillon_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/sillon_ci
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRETO: secreto-solo-para-ci-no-sirve-en-ningun-otro-lado
      TZ: UTC

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y correr tests
        run: ./mvnw -B -ntp verify

      - name: Guardar reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: target/surefire-reports/