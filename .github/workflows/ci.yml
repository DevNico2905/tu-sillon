name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si haces push otra vez al mismo PR, cancela la corrida anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el workflow solo lee el repo
permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sillon_ci
          POSTGRES_USER: sillon
          POSTGRES_PASSWORD: sillon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sillon -d sillon_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sillon_ci
      SPRING_DATASOURCE_USERNAME: sillon
      SPRING_DATASOURCE_PASSWORD: sillon_ci
      JWT_SECRETO: secreto-solo-para-ci-no-sirve-en-ningun-otro-lado
      TZ: UTC

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y correr tests
        run: ./mvnw -B -ntp verify

      - name: Guardar reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-surefire
          path: target/surefire-reports/